version: 2
updates:
  # npm dependencies (package.json), grouped into a single weekly PR to limit the noise.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      dependencies:
        patterns: [ "*" ]

  # GitHub Actions used by the workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
