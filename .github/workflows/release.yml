name: Release

# Runs when a Release is published on GitHub.
on:
  release:
    types: [ published ]

# OIDC Trusted Publishing: id-token issues a short-lived token and the provenance.
# No NPM_TOKEN needed.
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # npm (not bun) handles OIDC; Node 24 + npm@latest guarantees npm >= 11.5.1.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      # `npm publish` runs `prepublishOnly` (build + publint + attw),
      # then publishes with provenance (publishConfig), without a token thanks to OIDC.
      # The first version of a package is published by hand (trusted publishing needs the
      # package to exist): do nothing if this version is already on npm.
      - name: Publish to npm
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "$name@$version is already on npm"
          else
            # npm refuses a prerelease without a tag: 1.0.0-alpha.1 goes to "alpha", 1.0.0 to "latest".
            tag=$(node -p "require('./package.json').version.split('-')[1]?.split('.')[0] ?? 'latest'")
            npm publish --tag "$tag"
          fi

      # Rebuild the website so it shows the new release. It reads the version from npm,
      # so wait until npm serves it first. Skipped for a prerelease, or without the secret.
      - name: Rebuild the website
        env:
          SITE_DEPLOY_HOOK_URL: ${{ secrets.SITE_DEPLOY_HOOK_URL }}
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          case "$version" in *-*) echo "prerelease: website left alone"; exit 0 ;; esac
          if [ -z "$SITE_DEPLOY_HOOK_URL" ]; then echo "no SITE_DEPLOY_HOOK_URL secret"; exit 0; fi
          for attempt in $(seq 1 30); do
            [ "$(npm view "$name" dist-tags.latest)" = "$version" ] && break
            sleep 10
          done
          curl -fsS -X POST "$SITE_DEPLOY_HOOK_URL" > /dev/null
          echo "website rebuild requested"
