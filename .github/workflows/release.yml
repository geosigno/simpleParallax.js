name: Release

# Runs when a Release is published on GitHub.
on:
  release:
    types: [ published ]

# OIDC Trusted Publishing: id-token issues a short-lived token and the provenance.
# No NPM_TOKEN needed.
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # npm (not bun) handles OIDC; Node 24 + npm@latest guarantees npm >= 11.5.1.
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      # `npm publish` runs `prepublishOnly` (build + publint + attw),
      # then publishes with provenance (publishConfig), without a token thanks to OIDC.
      - name: Publish to npm
        run: npm publish
