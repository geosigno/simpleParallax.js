<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanilla JS App</title>

    <script type="module" src="main.js"></script>
    <style>
    img {
      display: block;
      width: 100%;
      height: auto;
    }
    .parallax {
      display: grid;
      grid-template-columns: repeat(1, 1fr);
      grid-gap: 40px;
      max-width: 900px;
      padding: 80vh 0;
      margin: 0 auto;
    }
    </style>
  </head>
  <body>
    <div class="parallax">
      <img src="image.png" alt="Parallax demo">
      <img src="image.png" alt="Parallax demo">
      <img src="image.png" alt="Parallax demo">
      <img src="image.png" alt="Parallax demo">
      <img src="image.png" alt="Parallax demo">
    </div>
  </body>
</html>
